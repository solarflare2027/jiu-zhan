ending_craft:
  ending_type_distribution: { 引语锁尾: 0.4, 呐喊号召: 0.2, 玄学升华(无我利他合一): 0.2, 后记二次收尾: 0.1, 谦辞反高潮: 0.1 }
  preferred_endings: [引语锁尾, 呐喊号召, 玄学升华]
  ending_templates:
    - type: 引语锁尾＋首尾对扣
      template: "[一句升华金句] + [呐喊号召] + [引语收束（常与开篇题记同源对扣）]"
      example: "接受过去，相信未来，活在当下。奋斗者们啊……发出嘶吼吧！「那黑的终点会有光」——五月天《成名在望》"
    - type: 玄学升华
      template: "把全文拉高到'消融自我/利他即利己/小我大我合一'"
      example: "利益整体就是最究竟地利益自己。"
  has_fixed_cta: false
  note: 公众号版常带"后记自述震撼＋求转发＋进群"；论著版不用。

# ── 场景增量 ──────────────────────────────
scene_extras:
  公众号:
    article_anatomy: [题记引语, 前言/献词, O1–O4或Part编号正文, 引经解经块, 金句独段, 升华呼告结尾, （可选）后记+转发/进群]
    community_naming: { reader: "奋斗者们/伙伴们", self: "洛伦兹第三定律/旭炎" }
    cta_position: 文末（后记里求转发/进群）
    has_brand_footer: true

# ── 禁区 ──────────────────────────────────
forbidden:
  - 纯学术腔（"综上所述""本研究表明"）与官方通稿语气
  - 西式长复合从句堆砌、翻译腔
  - 概念裸讲不配引文/不配类比（违背其"引文印章＋双轨类比"本能）
  - 滥用感叹号于说理段（他刻意克制，护思辨冷静人设）
  - 平铺无金句锤定（他必有独段短句一锤定音）

# ── 可调参数 ──────────────────────────────
tunables:
  intensity: { default: 0.7, description: "风格强度。低=只学结构(引文印章/金句锤定/三方对照)；高=连'啊'呼告、凡尔赛忏悔都用上" }
  register: { default: 论著, options: [公众号散文, 论著, 对话体], description: "文体寄存器。写《空性正文》用'论著'——保声音DNA、去公众号包装" }
  quote_density: { default: high, description: "引文密度。他的常态是 high（每论点坠一印章）" }
  emoji_enable: { default: false }

# ── 写《空性法则·正文》迁移指南（本档案的实战落点）──────────
kongxing_migration:
  keep:  # 焊进正文的声音 DNA
    - 引文印章：每条律义/收束后坠一句经典引文署名（道德经/金刚经/与神对话/物理学家）
    - 三方对照：东方典籍≈西方哲学≈前沿物理 强行焊为"同一件事"（这是他最独特的招）
    - 金句锤定：长释义后用一记独立成段短句一锤定音（"空，是满的。"）
    - 破折号下定义：—— 引出处＋下结论
    - 双轨类比：科学比喻（卡西米尔/狄拉克海）＋生活比喻（冰山/包装盒）并置落地
    - 低维错觉 → 高维真相 的释义骨架（＝他的"先破后立"，恰与极性正文家法重合）
    - 母题回响：守其黑、痛苦即礼物、心死道生、活在当下——可作收束的情感落点
    - 💹 投资映射：他的声音天然爱把哲理接到熊市底部/逆向（"守其黑，向渊而行"）
  adapt:
    - 小标题：用"渊宗律"等命名律＋四脊，沿用他爱用的"古籍短语作小标题"癖（但收敛为体系术语）
    - 呼告：保留少量第二人称"你"，但去掉"奋斗者们啊！"式公众号呐喊
  drop:  # 公众号包装，论著不用
    - 前言/后记/献词/求转发/进群/BGM提示
    - 炫战绩流水账（17倍/做空756%/履历自报家门）
    - 生日彩蛋、五月天歌词式私人化收尾
    - 过量感叹号与"哈哈哈/傻X/too young"网络口语
