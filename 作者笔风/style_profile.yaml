schema_version: "1.0"
profile_id: luolunzi-disandinglv
display_name: 洛伦兹第三定律
analyzed_at: 2026-06-18
sample_count: 7
sample_platforms: [公众号]
language: zh

sample_note: |
  7 篇：art1–art6 为 2022–2025 旧作；art7《七年，我建成了一套哲学体系，也找到了自己》为 2026 最新（成熟期）。
  art7 = 当前文笔与觉悟跃迁后的【上限声音】，权重最高；旧作提炼【穿越时间不变的声音底色】。
  样本量 7（🟡 速写偏中）：动词库/口头禅扎实，结构指纹（登山七段式）已可复制；满 15 篇可升级为完整档案。
  作者=笔名「洛伦兹第三定律」，基金「旭炎」，合伙人「秋斌」；体系《三道哲学》2026 上线 triatao.com。

portrait: |
  "洛伦兹第三定律"是把投资当修行的"哲学投资"创派者。文风=灵性顿悟体＋跨域引文拼贴＋金句锤定，
  三合一。最强签名：每个论点后必坠一句引文当"印章"，东方典籍≈西方哲学≈前沿物理三方强行对照
  （王阳明≈爱因斯坦≈量子塌缩）；长说理段后甩一记独立成段的短句一锤定音。自我呈现两极——极致忏悔
  （愚蠢/狂妄/无明）与密集炫战绩（17倍蔚来/做空756%）并置，常炫完即自我消解。母题恒定：痛苦即礼物、
  心死道生、臣服无我、破二元对立、活在当下、升维、灵魂进化、源头/道。骨架惯用"排比扣问→引文统一作答"
  开场，"金句＋呼告"收束，并以《周易》爻辞/佛号/古籍短语作章节小标题，制造谒语感。

# ── 演化轴（"像不像他"的关键背景）─────────────
evolution_axis: |
  2022 阶段（art5 少有人走的路、art6 用道德经孙子兵法）：入世·热血·战略·团队导向；
    引文重《孙子兵法》《道德经》《海贼王》毛泽东；情绪斗志昂扬；标点用 ASCII 连字符 -----/----。
  2024–2025 阶段（art1 暴风雨、art2 破二元、art3 匮乏感、art4 哲学投资）：出世·忏悔·灵性·修行导向；
    引文转向《与神对话》《臣服实验》《赛斯资料》《金刚经》庄圆法师；情绪是破碎后的顿悟与布道；
    标点改用规范全角 ——。转折点：2022–2024 三年大熊市＋寺庙禅修。
  2026 阶段（art7 七年/见道下山）：澄澈·沉静·收束·知行合一导向（成熟期·当前上限）。
    关键演化——①炫战绩流水账【彻底消失】（不再报 17 倍/做空 756%/履历），凡尔赛式忏悔收敛为安静的谦卑，
    "炫完即自我消解"动作退场；②呐喊"奋斗者们啊！"与过量感叹号几近清零，情绪走低音、内敛、留白；
    ③"为学日益→为道日损"——文字做减法，自喻"一根管道，让体系经由我流淌"，越写越简，收束到一个字"三"；
    ④新增学术注释体〔注N〕交叉引自家天道篇，论著严谨度上台阶；⑤英文术语内嵌（connecting the dots/overwhelm/
    JUST DO IT/vibe coding）；⑥引文印章+三方对照+金句锤定三大签名不减反强。
    转折点：2024-07"以天心为我心"立愿 + 冥想入"空门"遇"内在自我" + 2026-02 Claude Opus 4.6 触发 vibe coding 建站收官。

# ── 通用五维 ──────────────────────────────
title_craft:
  info_density: high
  formulas:
    - id: f1
      pattern: "[抽象名词] + 的意义/的诞生（起源·价值命名式）：把概念/经历当成可被赋义、可被诞生之物，回避投资术语，主打哲思"
      example: "《暴风雨的意义》《哲学投资的诞生》"
    - id: f2
      pattern: "如何真正地 + 走出/解决 [痛点] —— [价值观副标题]：问句直戳痛点，'真正地'否定一切既有解法，破折号副标题升维"
      example: "《如何真正地走出匮乏感？—— 对于成功的重新定义》"
    - id: f3
      pattern: "破X、拥Y（动宾对仗·反义并置）：两个反向动作并列，制造哲学张力与体系感"
      example: "《破二元对立、拥对立统一》"
    - id: f4
      pattern: "用 [权威经典/双IP] + 重塑 [领域]：借经典背书＋强动作词，主张颠覆性再造"
      example: "《用《道德经》与《孙子兵法》重塑投资哲学》"
    - id: f5
      pattern: "挪用名作之名作自我标签：借一部知名书/诗名，把自己投射为其中的孤勇主角"
      example: "《少有人走的路》"
    - id: f6
      pattern: "[整数年/数字]，我[外在成就]，也[内在升华]（双句对照·外成就→内觉醒反转）：用'也'把世俗成果一笔翻进灵魂收获，后半句才是真正的题眼"
      example: "《七年，我建成了一套哲学体系，也找到了自己》"
  notes: 标题与配文常嵌古诗（《题西林壁》"欲穷千里目"），文学化＋权威背书。f6 为 2026 成熟期新增，主题落到"找到自己/活成自己"。

opening_craft:
  hook_distribution:
    题记式引语开篇: 0.45
    前言坦白脆弱: 0.25
    设问反问入局: 0.2
    框架预告: 0.1
  preferred_hooks: [题记式引语开篇, 前言坦白脆弱, 设问反问入局]
  hook_templates:
    - hook: 题记式引语开篇
      template: "[名人/古诗/灵性书引语，独占篇首]\n\n—— [出处]\n\n[一句把引语接到自身经历/读者痛点的过渡]"
      example: "「当暴风雨过去……你已不再是，当初走进暴风雨里的那个人。」—— 村上春树。谨以此文献给每一位在低谷期奋斗着的朋友们。"
    - hook: 前言坦白脆弱
      template: "前言：[自曝低谷/痛苦/三年挑战]，直到[转折契机]……"
      example: "前言：过去的三年，我深陷匮乏困境。直到昨天，我在飞机上开始了这次与内在智慧的对话……"
    - hook: 排比扣问
      template: "[A是X吗？A是Y吗？]×N 组对偶问 → 一句统一击破"
      example: "光是粒子吗？光是波吗？……（连排9组）→ 两个都对、两个都不对。"
  background_placement: late
  pronoun_usage: { second_person: high, inclusive_we: mid, first_person_singular: high }

rhythm:
  pattern: "长说理段（150–300字，逗号排比层层推理）→ 一记独立成段的短句锤定（≤15字）→ 再起长段"
  short_paragraph_use: |
    越是情绪/顿悟高点越用独段金句，形态"短-断-硬"。例：
    "这就是暴风雨的意义。" / "在过程中体验，在体验中进化。" / "这就是本质。" /
    "但过程本身就是财富。" / "念念不忘，必有回响。" / "没有完美的天赋，只有用对地方的天赋。"
  uses_subheadings: true
  subheading_style:
    info_density: high
    note: |
      四种体系，与文体绑定：
      (一) O1–O4 章节号＋四字格/对仗格言标题（散文/自传/混合体）：
           "天欲其亡，必令其狂""心不死，则道不生""身不苦则福禄不厚／心不苦则智慧不开"；
           art5 暗合乾卦爻辞："启程：潜龙勿用→…→出山：见龙在田"。
      (二) 前言 + Part I–IV，每 Part 配一字概括词（纯论说体）："扣问→真相→目的→应用"。
      (三) 前言 + Part + 后记（对话体，包裹 Q&A）。
      (四) 登山英雄之旅·二字小标题链（2026 成熟期·自传顿悟体，art7）：
           前言→源起→入山→迷雾→见道→下山→结语；二字词暗合一段心路（攒点→自负→崩塌→空门见道→知行合一）；
           【每段必以一句古诗/偈语题记+破折号出处领起】（曹操观沧海→杜甫望岳→苏轼题西林壁→鲁智深辞世偈→
           庄子齐物论/老子/禅宗→苏轼定风波→回扣开篇曹操），首尾题记同源对扣。这是他最强的【结构指纹】。
    example: "心不死，则道不生 ／ 见道 ／ 下山"

language_style:
  power_verbs:
    - { verb: 嘶吼, replaces: 呐喊, intensity: 5, polarity: positive, example: "向命运的暴风雨发出嘶吼吧！" }
    - { verb: 爆锤, replaces: 击败, intensity: 5, polarity: negative, example: "再次进入被更强大的对手爆锤的循环" }
    - { verb: 压死, replaces: 终结, intensity: 4, polarity: negative, example: "压死那个自大的'小我'的最后一根稻草" }
    - { verb: 打到绝望破碎, replaces: 使崩溃, intensity: 5, polarity: negative, example: "把你的小我执着心打到绝望破碎" }
    - { verb: 厮杀, replaces: 历练, intensity: 5, polarity: neutral, example: "交易大神多是很早年便在实战中厮杀" }
    - { verb: 狩猎, replaces: 寻找标的, intensity: 4, polarity: negative, example: "像饿狼一样到处狩猎的投资人" }
    - { verb: 毁灭, replaces: 否定, intensity: 5, polarity: neutral, example: "你必须毁灭自己，然后才能创造出你自己" }
    - { verb: 覆灭, replaces: 落空, intensity: 4, polarity: negative, example: "无数次看到一些希望又重新覆灭" }
    - { verb: 消弭, replaces: 消除, intensity: 3, polarity: positive, example: "消弭了由于自己傲慢所造下的业障" }
    - { verb: 剥离, replaces: 去除, intensity: 3, polarity: neutral, example: "然后一点点剥离，由内在生发出真正的智慧" }
    - { verb: 消融, replaces: 放下, intensity: 3, polarity: positive, example: "放下要取得个人成就的执念，消融自我" }
    - { verb: 苏醒/觉醒, replaces: 明白, intensity: 4, polarity: positive, example: "我那一直沉睡的'内在意识'苏醒了" }
    - { verb: 塌缩/坍缩, replaces: 落定, intensity: 4, polarity: neutral, example: "一旦被观察就会导致'波函数塌缩'" }
    - { verb: 膨胀, replaces: 自负, intensity: 4, polarity: negative, example: "自我在无形中不断膨胀" }
    - { verb: 震撼, replaces: 触动, intensity: 5, polarity: positive, example: "当我知道此义之后，大为震撼" }
    - { verb: 冲击, replaces: 改变, intensity: 4, polarity: neutral, example: "极大地冲击了我对现实物理世界的认知" }
    - { verb: 折服, replaces: 佩服, intensity: 4, polarity: positive, example: "被他的投资视角折服" }
    - { verb: 穿透/直击, replaces: 看清, intensity: 4, polarity: positive, example: "穿透表象直击本质的探索" }
    - { verb: 翻盘, replaces: 反转, intensity: 4, polarity: positive, example: "在短时间内完成了三倍翻盘" }
    - { verb: 蜕变, replaces: 增长, intensity: 4, polarity: positive, example: "完成其5倍的蜕变" }
    - { verb: 凌虐, replaces: 折磨, intensity: 5, polarity: negative, example: "无止境求不得的痛楚……凌虐你" }
    - { verb: 侵蚀, replaces: 损害, intensity: 4, polarity: negative, example: "热钱疯狂涌入，侵蚀未来业绩" }
    - { verb: 嗅到, replaces: 察觉, intensity: 4, polarity: positive, example: "我能在千里之外就嗅到错误论点的气息" }
    - { verb: 狙击/做空/抄底/押注/清仓, replaces: 买卖（黑话化）, intensity: 4, polarity: neutral, example: "成功狙击英镑、做空泰铢；满仓押注阿里巴巴" }
  tone_palette:
    - { tone: 忏悔/低姿态自省, ratio: 0.25, features: "贬义词钉过去的自己(愚蠢/狂妄/无明/作死)；'过去的我…现在的我…'对照", typical_context: 复盘失败史 }
    - { tone: 顿悟/开示布道, ratio: 0.25, features: "短句断行、宣言式收尾、把佛道概念当结论砸下、引文背书", typical_context: 论点收口/A方回答 }
    - { tone: 论说/体系建构(冷静思辨), ratio: 0.2, features: "分层(第一/第二/第三)、术语堆叠、引证密集、长句", typical_context: 体系拆解 }
    - { tone: 热血/燃志昂扬, ratio: 0.15, features: "感叹号、第二人称呼告、军事航海词、燃点意象", typical_context: 结尾呼告/命名 }
    - { tone: 亲历叙事/凡尔赛炫战绩, ratio: 0.1, features: "时间轴＋具体倍数百分比、第一人称流水账、间或自嘲'哈哈哈'", typical_context: 自传履历, era_note: "⚠️仅 2022–2025；2026 成熟期此腔【退场】，自传改沉静谦卑、不报战绩、不自嘲" }
    - { tone: 澄澈沉静/谦卑见道(2026新增), ratio: "成熟期主调", features: "低音内敛、留白、做减法；以天心为我心；自喻管道；克制感叹与呼告；顿悟不再'砸'而是'落'", typical_context: art7 见道下山叙事 }
    - { tone: 对话体亲昵规劝, ratio: 0.05, features: "Q/A问答、A以'你'相称、包容耐心('没关系''加油！')", typical_context: 与内在智慧对话 }
  tone_transitions:
    - "低谷叙事 → 顿悟：以一句引文作'扳机'触发转折（'突然回忆起一句话…'之后语气由压抑转开示）"
    - "炫战绩 → 自我消解：高昂罗列后突然反转否定自我（'我也不知道这波到底算是赚还是亏'）"
    - "排比设问轰炸 → 一句古籍/名人引文收口定论"
    - "思辨升维 → 直接劝退再筛人（'觉得太烧脑的已经离去；愿继续的，你们将窥见更大的真相'）"
  punctuation_rules:
    - mark: "——（破折号）"
      function: "签名标点。三用：①引出引文出处 ②下定义/给结论的'冒号增强版' ③同位语补注"
      density: high
      example: "我将这个规律命名为'对立统一法则' —— '两个相互矛盾的真相，能同时并存于相同的地方'"
      note: "2022 旧作用 ASCII -----/---- 代替，2024+ 改规范全角 ——"
    - mark: "“ ”（双引号）"
      function: "极高频。①包裹古籍/名人原文 ②给自造术语挂牌('对立统一法则''内在智慧') ③核心字词概念加引('空''心''是''非') ④反讽留距离('政治正确')。几乎每个抽象概念首次出现都戴引号"
      density: very high
    - mark: "？（设问）"
      function: "认知扳机：排比设问把读者拽进二元困境再统一作答"
      density: "论说/对话体高，叙事体极低"
      example: "光是粒子吗？光是波吗？"
    - mark: "！（感叹号）"
      function: "克制。只留给燃志呼告/立志宣言/对话打气，绝不用于论说推理段（护'思辨冷静'人设）"
      density: low
      example: "向命运的暴风雨发出嘶吼吧！"
    - mark: "独句成段/断行"
      function: "把长句拆成单句逐行落下，造'谒语/经文'式呼吸停顿与重量感，替代标点的连接功能"
      density: mid
      example: "因为你抗拒过程。/但过程本身就是财富。"
    - mark: "〔注N〕学术脚注（2026 新增）"
      function: "正文出现硬核科学概念（狄拉克海/AdS-CFT）时挂角标，文末统一作注并【交叉引向自家天道篇某法则】，给玄思镀论著严谨度＋暗织体系内链"
      density: low
      example: "……同一样东西时〔注1〕……〔注1〕狄拉克海（1930）…详见三道哲学·天道篇·空性法则。"
    - mark: "英文术语内嵌（2026 新增）"
      function: "关键概念直接嵌英文原词，中译/中文在旁，营造'第一手原典'感与跨文化贯通；多为科学/AI/灵性外来概念"
      density: low
      example: "connecting the dots（回望连点）/ overwhelm / JUST DO IT / vibe coding / Hyle"
  signature_phrases:
    - { phrase: "这就是X的意义。", context: 收束句式，回扣标题作闭环 }
    - { phrase: "X的本质（就）是…… / 真正的原因是…… / 一言以蔽之", context: "高频下定义；全6篇'本质'29次" }
    - { phrase: "你看到了吗？/ 你明白了吗？/ 你知道吗？", context: 对话体反诘催悟 }
    - { phrase: "你必须先成为'非'，然后才能成为'是' / 必须先…才能…", context: 先否定后肯定的悖论对仗 }
    - { phrase: "活在当下 / 回到内在 / 接受过去，相信未来，活在当下", context: "修行内核口头禅；'当下'12次" }
    - { phrase: "念念不忘，必有回响", context: 灵感/命运降旨的转场 }
    - { phrase: "我之所以…正是因为… / X，正是Y", context: "因果强调；'正是'15次" }
    - { phrase: "整数年份丈量人生（七年/十年/三年）", context: "七、三两数字反复（七年建道/三部曲/三道/三相三识三性/三勇三力三道）" }
    - { phrase: "知道，与看见，从此是两回事。/ 见道是知，行道是把知活成行", context: "2026 核心对仗：知≠见、知≠行；知行合一作收口" }
    - { phrase: "为学日益→为道日损 / 不破不立 / 大死一番，绝后再苏", context: "2026 方法论口头禅：做减法、推翻几百万字重来" }
    - { phrase: "connecting the dots（你只能在回望时发现点早连成线）", context: "借乔布斯，串'攒点—合拢—成线'的旅程隐喻" }
    - { phrase: "我绕了整整X年……最后发现，我问的始终是同样的三句话——只是这一次我带着答案回来了", context: "首尾闭环顿悟句式：出发点=终点，但人已不同" }
    - { phrase: "谨以此文献给… / 我衷心希望… / 请慷慨地转发", context: 文末布道呼吁（公众号专属，论著不用） }
